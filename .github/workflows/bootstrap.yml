name: bootstrap-patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download patch bundle
        run: curl -fsSL "https://muse.ai/files/1252283737977069/1656354539404061/zy2tpq9b90qai98mr6baeq2g/HGhub-web-source-v4.zip" -o /tmp/patch.zip
      - name: Overlay source
        run: |
          cd /tmp && rm -rf patch && mkdir patch && unzip -q patch.zip -d patch
          rsync -a --exclude '.git' /tmp/patch/ $GITHUB_WORKSPACE/
      - name: Commit and push
        run: |
          git config user.name "hghub-bootstrap"
          git config user.email "bootstrap@localhost"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Apply web+iOS patch bundle" && git push origin HEAD:main; fi
